[project]
name = "ai-provider-ctl"
version = "0.1.0"
description = "Start/stop/status CLI and tray icon for the ai-provider server"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "pystray>=0.19",
    "pillow>=10.1",
]

[project.scripts]
ai-provider = "ai_provider_ctl.cli:main"

[project.gui-scripts]
ai-provider-tray = "ai_provider_ctl.tray:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_provider_ctl"]
